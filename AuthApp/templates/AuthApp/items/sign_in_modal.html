{% load static %}


<div class="modal fade" id="SignIn" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">

    <div class="modal-dialog" role="document">

        <div class="modal-content">

            <div class="modal-header">

                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>

                <h4 class="modal-title text-center" id="myModalLabel">Sign In</h4>

            </div>

            <div class="modal-body">

                <form class="signup-form" action="http://{{HOST}}:{{PORT}}/{{app_base_url}}/signin" method="post">
                    {% csrf_token %}

                    <div class="form-group">

                        <input type="text" name="username" class="form-control" placeholder="User Name" required="required">

                    </div>

                    <div class="form-group">

                        <input type="password" name="password" class="form-control" placeholder="Password" required="required">

                    </div>

                    <div class="form-group text-center">

                        <button type="submit" class="btn btn-blue btn-block">Log In</button>

                    </div>

                </form>

            </div>

            <div class="modal-footer text-center">

                <button type="button" class="btn-link" data-toggle="modal" data-target="#forgot_password"><span aria-hidden="true">forgot password</span></button>

            </div>

        </div>

    </div>

</div>
